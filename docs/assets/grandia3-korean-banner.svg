<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 460" role="img" aria-labelledby="title desc">
  <title id="title">Grandia III Korean Translation Project</title>
  <desc id="desc">A navy and violet project banner with a golden compass motif and Korean translation title.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1535"/>
      <stop offset="0.55" stop-color="#22245a"/>
      <stop offset="1" stop-color="#5d2d71"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1bd"/>
      <stop offset="0.45" stop-color="#f0c868"/>
      <stop offset="1" stop-color="#b8732e"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1400" height="460" rx="28" fill="url(#sky)"/>
  <path d="M0 350 C240 285 370 410 610 335 S1010 245 1400 335 V460 H0Z" fill="#10152f" opacity=".72"/>
  <path d="M0 385 C260 330 420 450 700 370 S1110 300 1400 375" fill="none" stroke="#8d62b7" stroke-width="2" opacity=".5"/>
  <g fill="#fff4c9" opacity=".9">
    <circle cx="95" cy="90" r="3"/><circle cx="185" cy="155" r="2"/><circle cx="315" cy="72" r="2"/>
    <circle cx="466" cy="132" r="3"/><circle cx="670" cy="68" r="2"/><circle cx="790" cy="150" r="3"/>
    <circle cx="1015" cy="76" r="2"/><circle cx="1190" cy="145" r="3"/><circle cx="1325" cy="82" r="2"/>
  </g>
  <g transform="translate(1110 224)" filter="url(#glow)">
    <circle r="132" fill="none" stroke="url(#gold)" stroke-width="3" opacity=".8"/>
    <circle r="105" fill="none" stroke="#f9dda0" stroke-width="1" opacity=".55"/>
    <path d="M0-120 L17-17 L120 0 L17 17 L0 120 L-17 17 L-120 0 L-17-17Z" fill="url(#gold)" opacity=".88"/>
    <path d="M0-79 L11-11 L79 0 L11 11 L0 79 L-11 11 L-79 0 L-11-11Z" fill="#242455"/>
    <circle r="14" fill="#f9dda0"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#fff8df">
    <text x="92" y="142" font-size="30" letter-spacing="9" fill="#f3d78f">PLAYSTATION 2 · FAN TRANSLATION</text>
    <text x="86" y="235" font-size="96" font-weight="700" letter-spacing="4">GRANDIA III</text>
    <text x="94" y="295" font-family="Arial, sans-serif" font-size="32" letter-spacing="5" fill="#f5d88e">KOREAN TRANSLATION PROJECT</text>
    <text x="94" y="356" font-family="Arial, sans-serif" font-size="26" fill="#e6dff2">텍스트 추출 · 번역 데이터 · 재현 가능한 패치 도구</text>
  </g>
  <rect x="34" y="34" width="1332" height="392" rx="22" fill="none" stroke="#f0c868" stroke-width="2" opacity=".55"/>
</svg>
